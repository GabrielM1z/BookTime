version: "3.8"

services:
  postgres:
    image: postgres:latest
    container_name: postgres_db
    ports:
      - 5432:5432
    env_file: ".env"
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: booktime_book
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  keycloak:
    build: ./keycloak
    command: start-dev
    environment:
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - 8080:8080
    volumes:
      - keycloak_data:/opt/keycloak/data/
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    env_file: ".env"
    networks:
      - backend

  api_books:
    container_name: api_books
    hostname: books
    build: 
      context: ./book
      target: prod
    ports:
      - 8083:8080
      - 4200:4200
    security_opt:
      - "seccomp:unconfined"
    restart: always
    environment:
      DB_HOST: postgres
      DB_NAME: book_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      IMAGE_STORAGE_PATH: /var/www/booktime/images/
    volumes:
      - api_volume:/usr/src/app/
      - book_images:/var/www/booktime/images/
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    env_file: ".env"

  api_news:
    container_name: api_news
    hostname: news
    build: ./news
    ports:
      - 8084:8080
    restart: always
    networks:
      - backend
    env_file: ".env"

  api_user:
    container_name: api_user
    hostname: user
    build: ./user
    ports:
      - 8085:8080
    restart: always
    environment:
      DB_HOST: postgres
      DB_NAME: book_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - api_volume:/usr/src/app/
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    env_file: ".env"

  api_gateway:
    container_name: api_gateway
    hostname: gateway
    build: ./gateway
    ports:
      - 8082:8080
    restart: always
    volumes:
      - api_volume:/usr/src/app/
    networks:
      - backend
    depends_on:
      keycloak:
        condition: service_healthy

  migrate:
    image: migrate/migrate:v4.15.2
    profiles: [ "tools" ]
    volumes:
      - ./migrations:/migrations
    entrypoint: [ "migrate", "-path", "/migrations", "-database", "postgres://postgres:${DB_PASSWORD}@postgres:5432/booktime_book?sslmode=disable" ]
    command: [ "up" ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - book_images:/var/www/booktime/images/
    depends_on:
      - api_books
    networks:
      - backend

volumes:
  postgres_data:
  api_volume:
  book_images:
  keycloak_data:

networks:
  backend:
    driver: bridge
